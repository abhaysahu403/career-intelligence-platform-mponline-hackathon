server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: student-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/cip_students
    username: ${DB_USER:cip_user}
    password: ${DB_PASSWORD:cip_password_123}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:cip-redis-pass}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
logging:
  level:
    com.cip: DEBUG
