server:
  port: ${SERVER_PORT:8087}

spring:
  application:
    name: recommendation-service
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/cip_recommendations
    username: ${DB_USER:cip_user}
    password: ${DB_PASSWORD:cip_password_123}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:cip-redis-pass}

student:
  service-url: ${STUDENT_SERVICE_URL:http://localhost:8082}
score:
  service-url: ${SCORE_SERVICE_URL:http://localhost:8088}
job:
  service-url: ${JOB_SERVICE_URL:http://localhost:8086}
ml:
  service-url: ${ML_SERVICE_URL:http://localhost:8000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
