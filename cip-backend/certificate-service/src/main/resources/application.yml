server:
  port: ${SERVER_PORT:8085}
  servlet:
    context-path: /

spring:
  application:
    name: certificate-service

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

  # CORS Configuration
  web:
    cors:
      allowed-origins:
        - "http://localhost:3000"
      allowed-methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      allowed-headers: "*"
      allow-credentials: true
      max-age: 3600

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/cip_certificate
    username: ${DB_USER:cip_user}
    password: ${DB_PASSWORD:cip_password_123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# ML Service
ml:
  service:
    url: ${ML_SERVICE_URL:http://localhost:8000}
    timeout-seconds: 30

# Storage
storage:
  type: ${STORAGE_TYPE:local}
  local:
    path: ${STORAGE_PATH:./storage/certificates}
  s3:
    bucket: ${S3_BUCKET:cip-certificates}
    region: ${AWS_REGION:ap-south-1}

# JWT
jwt:
  secret: ${JWT_SECRET:cip-certificate-jwt-secret-key-change-in-production}
  expiration-ms: 86400000

# Logging
logging:
  level:
    com.cip.certificate: DEBUG
    org.springframework.kafka: WARN
  file:
    name: logs/certificate-service.log

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
